<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>OpenFabric</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: Canvas;
      color: CanvasText;
    }

    main {
      width: min(92vw, 680px);
      text-align: center;
      padding: 48px 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(32px, 6vw, 56px);
      font-weight: 700;
      line-height: 1.05;
    }
  </style>
</head>
<body>
  <main>
    <h1>Thanks for using openfabric</h1>
  </main>
</body>
</html>
