<!doctype html>
<html lang="en" class="mobile-app-booting">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>OpenFabric Agent Mobile</title>
    <script>
      (() => {
        const root = document.documentElement;
        try {
          const theme = "";
          if (theme) {
            root.dataset.theme = theme;
          }
        } catch (_error) {}
      })();
    </script>
    <link rel="stylesheet" href="/agent-ui/static/mobile.css?v=20260602-text-odometer" />
  </head>
  <body>
    <div id="mobile-boot-screen" class="mobile-boot-screen" role="status" aria-live="polite">
      <strong>OpenFabric Agent</strong>
      <span>Loading</span>
    </div>

    <div id="mobile-root" class="mobile-root" data-notifications-open="false" data-parameters-open="false">
      <header id="mobile-topbar" class="mobile-topbar">
        <div class="mobile-agent-lockup">
          <span class="mobile-agent-name" id="mobile-agent-name">Agent</span>
          <span
            id="mobile-backend-status"
            class="mobile-status-dot"
            data-state="checking"
            role="status"
            aria-label="Checking backend connection"
          ></span>
        </div>
        <div class="mobile-topbar-actions">
          <label class="mobile-theme-picker" for="mobile-theme-select">
            <select id="mobile-theme-select" name="theme" aria-label="Theme">
              <option value="github">GitHub</option>
              <option value="light">Light</option>
              <option value="daylight">Daylight</option>
              <option value="mint">Mint</option>
              <option value="citrus">Citrus</option>
              <option value="rosewater">Rosewater</option>
              <option value="steel">Steel</option>
              <option value="graphite">Graphite</option>
              <option value="midnight">Midnight</option>
              <option value="aurora">Aurora</option>
              <option value="ember">Ember</option>
              <option value="ubuntu">Ubuntu</option>
              <option value="ubuntu-dark">Ubuntu Dark</option>
              <option value="dracula">Dracula</option>
              <option value="nord">Nord</option>
              <option value="tokyo-night">Tokyo Night</option>
              <option value="catppuccin-mocha">Catppuccin Mocha</option>
              <option value="solarized-dark">Solarized Dark</option>
              <option value="gruvbox-dark">Gruvbox Dark</option>
              <option value="nebula">Nebula</option>
              <option value="moss">Moss</option>
              <option value="retro">Retro</option>
              <option value="lagoon">Lagoon</option>
              <option value="sakura">Sakura</option>
              <option value="harbor">Harbor</option>
              <option value="circuit">Circuit</option>
              <option value="contrast">Contrast</option>
              <option value="random-pastel">Random Pastel</option>
            </select>
          </label>
          <button
            id="mobile-notifications-button"
            class="mobile-icon-button"
            type="button"
            aria-label="Notifications"
            aria-haspopup="dialog"
            aria-controls="notification-sheet"
            aria-expanded="false"
          >
            <span aria-hidden="true">N</span>
            <span id="mobile-notification-count" class="mobile-count-badge" hidden>0</span>
          </button>
          <button
            id="mobile-tasks-button"
            class="mobile-icon-button"
            type="button"
            aria-label="Tasks"
            aria-haspopup="dialog"
            aria-controls="mobile-task-sheet"
            aria-expanded="false"
          >
            <span aria-hidden="true">T</span>
            <span id="mobile-task-count" class="mobile-count-badge" hidden>0</span>
          </button>
          <button
            id="mobile-monitors-button"
            class="mobile-icon-button"
            type="button"
            aria-label="Monitors"
            aria-haspopup="dialog"
            aria-controls="mobile-monitor-sheet"
            aria-expanded="false"
          >
            <span aria-hidden="true">M</span>
            <span id="mobile-monitor-count" class="mobile-count-badge" hidden>0</span>
          </button>
          <button
            id="mobile-parameters-button"
            class="mobile-icon-button"
            type="button"
            aria-label="Parameter Store"
            aria-haspopup="dialog"
            aria-controls="mobile-parameter-sheet"
            aria-expanded="false"
          >
            <span aria-hidden="true">P</span>
          </button>
          <a id="mobile-directory-link" class="mobile-chip-link" href="/directory">Directory</a>
          <a
            id="mobile-manual-link"
            class="mobile-chip-link"
            href="http://127.0.0.1:8013/manual#doc=first-run-agent-ui"
            data-manual-link
            data-manual-doc="first-run-agent-ui"
            data-manual-port="8013"
            target="_blank"
            rel="noopener noreferrer"
          >
            Manual
          </a>
          <a id="mobile-desktop-link" class="mobile-chip-link" href="/agent-ui">Desktop</a>
        </div>
      </header>

      <main id="mobile-main" class="mobile-main">
        <section
          id="mobile-chat-panel"
          class="mobile-chat-panel"
          aria-label="Chat"
        >
          <div class="mobile-chat-status-row">
            <label class="mobile-gateway-picker" for="mobile-gateway-select">
              <span>Terminal</span>
              <select id="mobile-gateway-select" name="gateway" aria-label="Gateway terminal">
                <option value="">Default</option>
              </select>
            </label>
            <span id="mobile-run-status" class="mobile-status-pill" data-tone="neutral">Idle</span>
          </div>
          <div id="mobile-chat-log" class="mobile-chat-log" aria-live="polite">
            <article class="mobile-message mobile-message-assistant">
              <div class="mobile-message-label">OpenFabric</div>
              <div class="mobile-message-body">Ready.</div>
            </article>
          </div>
          <form id="mobile-chat-form" class="mobile-composer">
            <button
              id="mobile-new-chat-button"
              class="mobile-icon-button mobile-composer-button"
              type="button"
              aria-label="New chat"
              title="New chat"
            >
              +
            </button>
            <button
              id="mobile-mic-button"
              class="mobile-icon-button mobile-composer-button"
              type="button"
              aria-label="Voice input"
              title="Voice input"
              data-state="idle"
            >
              <span id="mobile-mic-label">Mic</span>
              <span class="mobile-loading-dots" aria-hidden="true" hidden>
                <span></span><span></span><span></span>
              </span>
            </button>
            <button
              id="mobile-terminal-button"
              class="mobile-icon-button mobile-composer-button mobile-terminal-button"
              type="button"
              aria-label="Open terminal"
              title="Open terminal"
            >
              <span aria-hidden="true">&gt;_</span>
            </button>
            <label class="mobile-prompt-wrap" for="mobile-prompt-input">
              <textarea
                id="mobile-prompt-input"
                name="prompt"
                rows="1"
                autocomplete="off"
                spellcheck="true"
                placeholder="Ask OpenFabric"
                aria-autocomplete="list"
                aria-controls="mobile-parameter-shortcut-menu"
                aria-expanded="false"
              ></textarea>
            </label>
            <div
              id="mobile-parameter-shortcut-menu"
              class="mobile-parameter-shortcut-menu"
              role="listbox"
              aria-label="Parameter shortcuts"
              hidden
            ></div>
            <button id="mobile-stop-button" class="mobile-icon-button mobile-composer-button" type="button" disabled>
              Stop
            </button>
            <button id="mobile-send-button" class="mobile-send-button" type="submit">Send</button>
          </form>
        </section>

        <aside
          id="notification-sheet"
          class="mobile-notification-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="notification-sheet-title"
          aria-hidden="true"
          hidden
        >
          <header class="mobile-panel-header">
            <div>
              <h2 id="notification-sheet-title">Notifications</h2>
              <span>Reminders and event alerts</span>
            </div>
            <button
              id="mobile-notifications-close"
              class="mobile-small-button"
              type="button"
              aria-label="Close notifications"
            >
              Close
            </button>
          </header>
          <div id="mobile-notification-list" class="mobile-list" aria-live="polite"></div>
          <footer class="mobile-panel-footer">
            <div class="mobile-notification-options" aria-label="Notification delivery">
              <label>
                <input id="mobile-browser-notifications-enabled" type="checkbox" />
                <span>Browser</span>
              </label>
              <button id="mobile-browser-notifications-permission" type="button">Allow</button>
              <label>
                <span>Sound</span>
                <select id="mobile-notification-sound-select" aria-label="Notification sound">
                  <option value="off">Off</option>
                  <option value="chime">Chime</option>
                  <option value="ping">Ping</option>
                  <option value="soft">Soft</option>
                  <option value="alert">Alert</option>
                </select>
              </label>
              <button id="mobile-notification-sound-test" type="button">Test</button>
            </div>
            <div class="mobile-notification-actions">
              <button id="mobile-notifications-mark-read" type="button">Mark all read</button>
              <button id="mobile-notifications-refresh" type="button">Refresh</button>
            </div>
          </footer>
        </aside>
        <aside
          id="mobile-task-sheet"
          class="mobile-notification-panel mobile-task-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="mobile-task-sheet-title"
          aria-hidden="true"
          hidden
        >
          <header class="mobile-panel-header">
            <div>
              <h2 id="mobile-task-sheet-title">Tasks</h2>
              <span>Durable background work</span>
            </div>
            <button
              id="mobile-tasks-close"
              class="mobile-small-button"
              type="button"
              aria-label="Close tasks"
            >
              Close
            </button>
          </header>
          <div class="mobile-task-create">
            <input id="mobile-task-title" type="text" autocomplete="off" placeholder="Title" />
            <textarea id="mobile-task-prompt" rows="3" placeholder="Task prompt"></textarea>
            <div class="mobile-inline-actions">
              <button id="mobile-task-create" type="button">Create</button>
              <button id="mobile-task-create-start" type="button">Create + Start</button>
            </div>
          </div>
          <div id="mobile-task-list" class="mobile-list" aria-live="polite"></div>
          <footer class="mobile-panel-footer">
            <div class="mobile-notification-actions">
              <button id="mobile-tasks-refresh" type="button">Refresh</button>
            </div>
          </footer>
        </aside>
        <aside
          id="mobile-monitor-sheet"
          class="mobile-notification-panel mobile-monitor-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="mobile-monitor-sheet-title"
          aria-hidden="true"
          hidden
        >
          <header class="mobile-panel-header">
            <div>
              <h2 id="mobile-monitor-sheet-title">Monitors</h2>
              <span>Background terminal watches</span>
            </div>
            <button
              id="mobile-monitors-close"
              class="mobile-small-button"
              type="button"
              aria-label="Close monitors"
            >
              Close
            </button>
          </header>
          <div class="mobile-task-create mobile-monitor-create">
            <input id="mobile-monitor-title" type="text" autocomplete="off" placeholder="Title" />
            <textarea id="mobile-monitor-command" rows="3" placeholder="Command"></textarea>
            <div class="mobile-monitor-grid">
              <select id="mobile-monitor-mode" aria-label="Monitor mode">
                <option value="sample_command">Sample</option>
                <option value="raw_stream">Stream</option>
              </select>
              <input id="mobile-monitor-interval" type="number" min="1" step="1" value="5" aria-label="Interval seconds" />
              <input id="mobile-monitor-duration" type="number" min="1" step="1" value="300" aria-label="Duration seconds" />
            </div>
            <input id="mobile-monitor-condition" type="text" autocomplete="off" placeholder="Condition" />
            <textarea id="mobile-monitor-action" rows="2" placeholder="Action task prompt"></textarea>
            <div class="mobile-inline-actions">
              <button id="mobile-monitor-create" type="button">Create</button>
              <button id="mobile-monitor-create-start" type="button">Create + Start</button>
            </div>
          </div>
          <div id="mobile-monitor-list" class="mobile-list" aria-live="polite"></div>
          <footer class="mobile-panel-footer">
            <div class="mobile-notification-actions">
              <button id="mobile-monitors-refresh" type="button">Refresh</button>
            </div>
          </footer>
        </aside>
        <aside
          id="mobile-parameter-sheet"
          class="mobile-notification-panel mobile-parameter-panel"
          role="dialog"
          aria-modal="true"
          aria-labelledby="mobile-parameter-sheet-title"
          aria-hidden="true"
          hidden
        >
          <header class="mobile-panel-header">
            <div>
              <h2 id="mobile-parameter-sheet-title">Parameters</h2>
              <span>Local key/value JSON</span>
            </div>
            <button
              id="mobile-parameters-close"
              class="mobile-small-button"
              type="button"
              aria-label="Close parameter store"
            >
              Close
            </button>
          </header>
          <div class="mobile-task-create mobile-parameter-editor">
            <input id="mobile-parameter-search" type="search" autocomplete="off" placeholder="Search parameters" />
            <input id="mobile-parameter-key" type="text" autocomplete="off" placeholder="Key" />
            <input id="mobile-parameter-description" type="text" autocomplete="off" placeholder="Description" />
            <textarea id="mobile-parameter-value" rows="6" spellcheck="false" placeholder='{"host":"10.4.4.4","port":9045}'></textarea>
            <input id="mobile-parameter-aliases" type="text" autocomplete="off" placeholder="Aliases, comma separated" />
            <input id="mobile-parameter-tags" type="text" autocomplete="off" placeholder="Tags, comma separated" />
            <label class="mobile-inline-check">
              <input id="mobile-parameter-sensitive" type="checkbox" checked />
              <span>Sensitive</span>
            </label>
            <div class="mobile-inline-actions">
              <button id="mobile-parameter-new" type="button">New</button>
              <button id="mobile-parameter-save" type="button">Save</button>
              <button id="mobile-parameter-reveal" type="button">Reveal</button>
              <button id="mobile-parameter-delete" type="button">Delete</button>
            </div>
          </div>
          <div id="mobile-parameter-list" class="mobile-list" aria-live="polite"></div>
          <footer class="mobile-panel-footer">
            <div class="mobile-notification-actions">
              <button id="mobile-parameters-refresh" type="button">Refresh</button>
            </div>
          </footer>
        </aside>
      </main>
    </div>

    <div id="mobile-sheet-backdrop" class="mobile-sheet-backdrop" hidden></div>
    <div id="mobile-toast-region" class="mobile-toast-region" aria-live="polite"></div>
    <script src="/agent-ui/static/agent_ui_shared.js?v=20260602-text-odometer"></script>
    <script src="/agent-ui/static/mobile.js?v=20260602-text-odometer" defer></script>
  </body>
</html>
