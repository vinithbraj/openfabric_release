<!doctype html>
<html lang="en" class="app-booting">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenFabric Directory</title>
    <script>
      (() => {
        const root = document.documentElement;
        const allowedThemes = new Set([
          "github",
          "light",
          "daylight",
          "mint",
          "citrus",
          "rosewater",
          "steel",
          "graphite",
          "midnight",
          "aurora",
          "ember",
          "ubuntu",
          "ubuntu-dark",
          "dracula",
          "nord",
          "tokyo-night",
          "catppuccin-mocha",
          "solarized-dark",
          "gruvbox-dark",
          "nebula",
          "moss",
          "retro",
          "lagoon",
          "sakura",
          "harbor",
          "circuit",
          "contrast",
          "random-pastel",
        ]);
        const normalizedTheme = (theme) => (allowedThemes.has(theme) ? theme : "");
        const themeFromSettings = () => {
          try {
            const settings = JSON.parse("{}");
            return typeof settings?.ui_theme === "string" ? settings.ui_theme : "";
          } catch (_error) {
            return "";
          }
        };
        try {
          const savedTheme = normalizedTheme("")
            || normalizedTheme(themeFromSettings());
          if (savedTheme) {
            root.dataset.theme = savedTheme;
          }
        } catch (_error) {}
      })();
    </script>
    <link rel="stylesheet" href="/agent-ui/static/app.css?v=20260606-prompt-gutters" />
    <link rel="stylesheet" href="/agent-ui/static/directory.css?v=20260530-coherent-ui" />
  </head>
  <body class="directory-body">
    <div id="app-boot-screen" class="app-boot-screen" role="status" aria-live="polite">
      <div class="app-boot-card">
        <span class="app-boot-orbit" aria-hidden="true"></span>
        <strong>OpenFabric Directory</strong>
        <span>Loading paths</span>
      </div>
    </div>
    <main class="directory-shell">
      <header class="directory-topbar">
        <div class="directory-brand">
          <a href="/directory">OpenFabric</a>
          <h1>Directory</h1>
        </div>
        <div class="directory-actions">
          <label class="directory-search" for="directory-search">
            <span>Search</span>
            <input
              id="directory-search"
              type="search"
              autocomplete="off"
              placeholder="Find paths"
              aria-label="Search paths"
            />
          </label>
          <a
            id="directory-manual-link"
            class="directory-action-link"
            href="http://127.0.0.1:8013/manual#doc=manual-home"
            data-manual-link
            data-manual-doc="manual-home"
            data-manual-port="8013"
            target="_blank"
            rel="noopener noreferrer"
          >
            Manual
          </a>
          <a class="directory-action-link" href="/agent-ui">Chat</a>
        </div>
      </header>

      <section class="directory-statusbar" aria-label="Directory status">
        <span id="directory-status" data-state="loading">Loading available paths</span>
        <span id="directory-count">0 paths</span>
      </section>

      <section class="directory-content" aria-label="Available runtime paths">
        <section class="directory-section" aria-labelledby="directory-pages-title">
          <header class="directory-section-header">
            <h2 id="directory-pages-title">Primary Paths</h2>
            <span>Landing pages and service entrypoints</span>
          </header>
          <div id="directory-page-list" class="directory-card-grid"></div>
        </section>

        <section class="directory-section directory-routes-section" aria-labelledby="directory-routes-title">
          <header class="directory-section-header">
            <h2 id="directory-routes-title">Route Inventory</h2>
            <span>Generated from the current FastAPI app</span>
          </header>
          <div id="directory-route-groups" class="directory-route-groups"></div>
        </section>
      </section>
    </main>
    <script src="/agent-ui/static/agent_ui_shared.js?v=20260602-text-odometer"></script>
    <script src="/agent-ui/static/directory.js?v=20260531-website-service" defer></script>
  </body>
</html>
