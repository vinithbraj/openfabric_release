[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aor-runtime"
version = "0.10.0"
description = "OpenFABRIC agent runtime with typed planning, execution, and OpenAI-compatible APIs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.2,<3.0",
  "playwright>=1.49,<2.0",
  "pydantic>=2.11,<3.0",
  "pyyaml>=6.0.2,<7.0",
  "rich>=14.0,<15.0",
  "sqlglot>=26.0,<27.0",
  "tabulate>=0.9,<1.0",
  "typer>=0.16,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "websockets>=16.0,<17.0",
  "wsproto>=1.2,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "ipython>=9.0,<10.0",
  "pytest>=8.0,<9.0",
]
manual = [
  "markdown-it-py>=3,<4",
]
python-tools = [
  "bandit>=1.8,<2.0",
  "black>=25.0,<26.0",
  "build>=1.2,<2.0",
  "coverage>=7.0,<8.0",
  "flake8>=7.0,<8.0",
  "isort>=6.0,<7.0",
  "mypy>=1.10,<2.0",
  "openpyxl>=3.1,<4.0",
  "pip-audit>=2.7,<3.0",
  "pipdeptree>=2.20,<3.0",
  "pre-commit>=4.0,<5.0",
  "pyarrow>=15.0,<23.0",
  "pylint>=3.0,<5.0",
  "pyright>=1.1,<2.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.8,<1.0",
  "twine>=6.0,<7.0",
]

[project.scripts]
aor = "agent_runtime.api.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agent_runtime.api" = ["static/agent_ui/*", "static/agent_ui/vendor/xterm/*"]
"manual" = [
  "content/*.md",
  "content/architecture/*.md",
  "content/legacy/*.md",
  "static/*",
  "static/vendor/mermaid/*",
]
"website" = ["static/index.html"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.openfabric.agent_python_tools]
description = "Python command/tool inventory used by seeded agent memories for planning and recommendations."
stdlib_modules = [
  "argparse",
  "ast",
  "calendar",
  "compileall",
  "configparser",
  "cProfile",
  "csv",
  "datetime",
  "difflib",
  "dis",
  "doctest",
  "ensurepip",
  "gc",
  "hashlib",
  "http.client",
  "http.server",
  "importlib.metadata",
  "importlib.util",
  "json",
  "json.tool",
  "logging",
  "pathlib",
  "pdb",
  "pstats",
  "py_compile",
  "pydoc",
  "re",
  "shutil",
  "site",
  "socket",
  "sqlite3",
  "statistics",
  "subprocess",
  "sysconfig",
  "tabnanny",
  "tarfile",
  "tempfile",
  "timeit",
  "tokenize",
  "tomllib",
  "trace",
  "traceback",
  "tracemalloc",
  "urllib.parse",
  "urllib.request",
  "venv",
  "zipfile",
  "zoneinfo",
]
external_tools = [
  "bandit",
  "black",
  "build",
  "coverage",
  "flake8",
  "isort",
  "mypy",
  "pip-audit",
  "pipdeptree",
  "pre-commit",
  "pylint",
  "pyright",
  "pytest",
  "pytest-cov",
  "ruff",
  "twine",
]
runtime_packages = [
  "fastapi",
  "numpy",
  "pandas",
  "playwright",
  "pydantic",
  "pyyaml",
  "rich",
  "tabulate",
  "typer",
  "uvicorn",
]
preferred_command_prefixes = [
  "python -m",
  "python -c",
  "python - <<'PY'",
]

[tool.openfabric.gateway_python_tools]
description = "Python command/tool inventory expected to be runnable through gateway shell execution when installed in the gateway environment."
stdlib_commands = [
  "python --version",
  "python -VV",
  "python -m calendar",
  "python -m compileall",
  "python -m cProfile",
  "python -m difflib",
  "python -m dis",
  "python -m doctest",
  "python -m ensurepip",
  "python -m http.server",
  "python -m json.tool",
  "python -m pdb",
  "python -m pstats",
  "python -m py_compile",
  "python -m pydoc",
  "python -m site",
  "python -m sysconfig",
  "python -m tabnanny",
  "python -m tarfile",
  "python -m timeit",
  "python -m tokenize",
  "python -m trace",
  "python -m venv",
  "python -m zipfile",
]
package_tool_commands = [
  "python -m bandit",
  "python -m black",
  "python -m build",
  "python -m coverage",
  "python -m flake8",
  "python -m isort",
  "python -m mypy",
  "python -m pip",
  "python -m pip-audit",
  "python -m pipdeptree",
  "python -m playwright",
  "python -m pre_commit",
  "python -m pylint",
  "python -m pyright",
  "python -m pytest",
  "python -m ruff",
  "python -m twine",
  "python -m uvicorn",
]
safety_notes = [
  "Prefer python -m so commands use the active gateway interpreter.",
  "Run package installation, cache purges, builds, uploads, and file writes only when explicitly requested or approval-gated.",
  "For interactive debuggers or servers, route through terminal-capable shell execution instead of captured non-interactive execution.",
]
