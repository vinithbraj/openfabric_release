services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: ${OPENFABRIC_IMAGE:-openfabric-server}:${OPENFABRIC_VERSION:-latest}
    container_name: openfabric-server
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8011:8011"
    environment:
      AOR_HOST: 0.0.0.0
      AOR_PORT: "8011"
      AOR_SSL_ENABLED: "0"
      AOR_AVAILABLE_NODES: localhost
      AOR_DEFAULT_NODE: localhost
      AOR_GATEWAY_URL: http://host.docker.internal:8787
      AOR_GATEWAY_TIMEOUT_SECONDS: "30"
      AOR_ONLINE_AI_CHECK_HEADLESS: "1"
      AOR_LLM_PREFLIGHT_ENABLED: "0"
      AOR_AUDIO_TRANSCRIBER_ENABLED: "0"
      AOR_DOWNLOAD_WHISPER_MODEL: "0"
      # Optional legacy bootstrap config:
      # AOR_APP_CONFIG_PATH: /data/config.yaml
    volumes:
      - openfabric-data:/data
      # Mount an explicit bootstrap config only when AOR_APP_CONFIG_PATH is set:
      # - ../config.yaml:/data/config.yaml:ro
    restart: unless-stopped

  manual:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: ${OPENFABRIC_IMAGE:-openfabric-server}:${OPENFABRIC_VERSION:-latest}
    container_name: openfabric-manual
    ports:
      - "8013:8013"
    entrypoint:
      - python
      - -m
      - uvicorn
    command:
      - --app-dir
      - /opt/openfabric/src
      - manual.app:create_app
      - --factory
      - --host
      - 0.0.0.0
      - --port
      - "8013"
    environment:
      AOR_MANUAL_HOST: 0.0.0.0
      AOR_MANUAL_PORT: "8013"
    restart: unless-stopped

volumes:
  openfabric-data:
